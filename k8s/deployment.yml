apiVersion: apps/v1
kind: Deployment
metadata:
  name: ipinfo-local-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ipinfo-local-service
  template:
    metadata:
      labels:
        app: ipinfo-local-service
    spec:
      containers:
        - name: app
          image: registry.example.com/ipinfo-local-service:1.0.0
          ports:
            - containerPort: 8080
          env:
            - name: IPINFO_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ipinfo-secret
                  key: IPINFO_TOKEN
            - name: IPINFO_DATABASE_PATH
              value: /opt/app/data/ipinfo_lite.mmdb
            - name: IPINFO_UPDATE_CRON
              value: "0 0 3 * * SAT"
            - name: IPINFO_UPDATE_ZONE
              value: America/Bogota
          volumeMounts:
            - name: ipinfo-data
              mountPath: /opt/app/data
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
      volumes:
        - name: ipinfo-data
          persistentVolumeClaim:
            claimName: ipinfo-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: ipinfo-local-service
spec:
  selector:
    app: ipinfo-local-service
  ports:
    - port: 80
      targetPort: 8080
